# Publishes the site to GitHub Pages, with the forecast and station measurements refreshed.
#
# Twice a day it pulls the latest run of every weather model. The schedule follows ECMWF, the
# last of the big models to land: its 00Z run is on Open-Meteo by about 08:00 UTC and its 12Z run
# by about 20:00 UTC. A push publishes new code at once, reusing the forecast already on the site
# unless that is more than 12 hours old. Nothing is committed back, so the repository does not
# grow with every refresh.
name: Refresh snow data and publish

on:
  schedule:
    - cron: '30 8,20 * * *'
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    outputs:
      artifact: github-pages-${{ github.run_attempt }}
    env:
      # The site's own address (set in the repository's Pages settings; DNS at Vercel). The
      # github.io address only redirects here, so the published data is read from this one.
      LIVE: https://powtracker.app/data
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      # The forecast refresh takes about 10 minutes on Open-Meteo's free tier, and can be refused:
      # the tier's limits are counted per network address, and this runner shares its address with
      # other projects. So a refresh that fails, or that a push does not need, must never stop
      # the site from being published: the forecast already on the site is kept instead.
      # With the OPEN_METEO_API_KEY secret set, the commercial endpoint is used and neither applies.
      # The first scheduled run (2026-11-17) needed 26 minutes because new connections from the
      # runner kept timing out, and a 25-minute limit stopped it one batch short. The script now
      # holds one connection open; the limit leaves room in case that is not the whole story.
      - name: Forecast snapshot
        timeout-minutes: 40
        continue-on-error: true
        id: forecast
        env:
          OPEN_METEO_API_KEY: ${{ secrets.OPEN_METEO_API_KEY }}
        run: |
          if [ "${{ github.event_name }}" = "push" ] && curl -fsSL -o published.json "$LIVE/forecast.json" \
            && node -e "const f = JSON.parse(require('fs').readFileSync('published.json', 'utf8')); process.exit(Date.now() - Date.parse(f.generated) < 12 * 3600e3 ? 0 : 1)"; then
            mv published.json public/data/forecast.json
            echo "Reused the forecast published on the site: it is under 12 hours old."
          else
            node scripts/ingest.ts
          fi
      - name: Keep the published forecast when the refresh failed
        if: steps.forecast.outcome == 'failure'
        run: |
          echo "::warning::The forecast refresh failed; publishing with the last forecast instead."
          # Only a file that really is a forecast may replace the one in the repository: a
          # redirect or an error page saved in its place would publish a site with no forecasts.
          if curl -fsSL -o published.json "$LIVE/forecast.json" \
            && node -e "const f = JSON.parse(require('fs').readFileSync('published.json', 'utf8')); process.exit(f.generated && Object.keys(f.resorts).length > 100 ? 0 : 1)"; then
            mv published.json public/data/forecast.json
          else
            echo "::warning::No published forecast to fall back on: using the one in the repository."
          fi
      # Station measurements are quick and have no such limits: refresh them every time. A source
      # being down must not block the rest.
      - name: Station measurements
        run: node scripts/ingest-obs.ts
        continue-on-error: true
      - name: Refresh the dated Bear Valley bulletin (the status board loads live in the browser)
        run: npm run data:bulletin
        continue-on-error: true
      - name: Collect official mountain reports
        continue-on-error: true
        run: |
          # Preserve the last good readings per source through a temporary outage. Never
          # update their observation or collection timestamps just because a job ran.
          curl -fsSL --max-time 15 -o "$RUNNER_TEMP/last-reports.json" "$LIVE/reports.json" || true
          node scripts/ingest-reports.ts "$RUNNER_TEMP/last-reports.json"
      # The repository variable PAY_URL, once set to the payment service's address, turns the
      # paywall on and sells Pro on the site. Unset, the site shows everything.
      - run: npm run build
        env:
          VITE_PAY_URL: ${{ vars.PAY_URL }}
      - uses: actions/upload-pages-artifact@v5
        with:
          # A job retry keeps earlier artifacts under the same run ID. Publish only this attempt.
          name: github-pages-${{ github.run_attempt }}
          path: dist

  # Start publication after the upload job completes. Retrying just this job reuses the
  # original upload (and does not repeat any weather requests).
  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v5
        with:
          artifact_name: ${{ needs.build.outputs.artifact }}
